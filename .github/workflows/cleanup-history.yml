# 임시: 히스토리 정리 (한 번 쓰고 지움)
# 1) 최신 버전(src/version.py) 릴리스만 남기고 나머지 릴리스 · 태그 삭제
# 2) 이 파일이 main 에서 지워질 때까지 기다림 (Actions 토큰은 워크플로 파일을 바꾸는 커밋을 못 올리므로)
# 3) main 을 지금 내용 그대로 커밋 하나로 만들고, 최신 버전 태그를 그 커밋으로 옮김
name: Cleanup history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          keep="v$(python3 -c "import sys; sys.path.insert(0, 'src'); import version; print(version.VERSION)")"
          echo "keep=$keep" >> "$GITHUB_ENV"
          gh release view "$keep" --json tagName > /dev/null    # 최신 릴리스가 없으면 여기서 멈춤
          for t in $(gh release list --limit 300 --json tagName -q '.[].tagName'); do
            if [ "$t" != "$keep" ]; then gh release delete "$t" --yes --cleanup-tag; echo "deleted release $t"; fi
          done
          for t in $(git ls-remote --tags origin | awk '{print $2}' | grep -v '\^{}' | sed 's#refs/tags/##'); do
            if [ "$t" != "$keep" ]; then git push -q origin ":refs/tags/$t" || true; echo "deleted tag $t"; fi
          done

      - name: Wait until this workflow file is removed from main
        run: |
          for i in $(seq 1 90); do
            git fetch -q origin main
            if ! git cat-file -e origin/main:.github/workflows/cleanup-history.yml 2>/dev/null; then echo ready; exit 0; fi
            sleep 10
          done
          echo "timed out waiting"; exit 1

      - name: Squash main into one commit and move the latest tag
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(git rev-parse "origin/main^{tree}")
          new=$(git commit-tree "$tree" -m "Acrux macro $keep")
          git push -f origin "$new:refs/heads/main"
          git tag -f "$keep" "$new"
          git push -f origin "refs/tags/$keep"
          echo "main is now $new ($keep)"
