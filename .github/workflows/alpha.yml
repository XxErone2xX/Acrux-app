# Acrux 알파 (Tauri) 빌드 — 정식 앱 (PC V2.5.x · Mobile V1.4.x) 과 따로
#   dev 에서는 Android APK · Windows exe 를 검사하고 실행 파일을 첨부하며, main 에서는 'alpha' 미리 보기 릴리스도 갱신
#   'alpha' 는 최신 릴리스로 표시하지 않음 (PC 실행기는 releases/latest · 모바일 업데이트는 mobile-latest 를 봄 → 정식 앱 업데이트에 안 섞임)
#   빌드가 실패하면 기록을 alpha-build-log 릴리스에 올림 (원인 확인용)
name: Alpha

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths: ["src-tauri/**", "frontend/**", "package.json", "package-lock.json", "tsconfig.json",
            "android/app/src/main/assets/i18n/**", "src/web/**", "tests/**", ".github/workflows/alpha.yml"]

permissions:
  contents: write

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux build and X11 test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
      - name: Check desktop and native X11 adapter
        run: |
          npm ci
          npm run build
          npm run test:desktop
          python3 -m unittest discover -s tests -v
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          xvfb-run -a env ACRUX_X11_TEST=1 cargo test --locked --manifest-path src-tauri/Cargo.toml --lib linux::tests::native_x11_capture_and_input -- --ignored --test-threads=1
      - name: Build Linux app
        run: npm run build:linux -- --ci
      - name: Check Linux application startup
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/acrux-linux-profile"
          mkdir -p "$XDG_CONFIG_HOME/com.acrux.next"
          echo '{"online":{"share":false}}' > "$XDG_CONFIG_HOME/com.acrux.next/profile.json"
          GDK_BACKEND=x11 xvfb-run -a python3 - <<'PY'
          import subprocess, time
          app = subprocess.Popen(['src-tauri/target/release/acrux'])
          try:
              time.sleep(5)
              assert app.poll() is None, f'Acrux exited during startup ({app.returncode})'
          finally:
              if app.poll() is None:
                  app.terminate()
                  app.wait(timeout=10)
          PY
          cp src-tauri/target/release/acrux Acrux-Dev-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: dev-linux
          path: Acrux-Dev-Linux
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Keep the same debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: acrux-alpha-debug-keystore
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          {
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            if [ -n "${{ secrets.ACRUX_ALPHA_KEYSTORE_B64 }}" ]; then
              echo "${{ secrets.ACRUX_ALPHA_KEYSTORE_B64 }}" | base64 -d > /tmp/alpha.jks
              export ACRUX_ALPHA_KEYSTORE=/tmp/alpha.jks ACRUX_ALPHA_KEYSTORE_PASS="${{ secrets.ACRUX_ALPHA_KEYSTORE_PASS }}"
            else
              # 비밀값이 없으면 캐시해 둔 디버그 키 (없으면 한 번 만듦 → 캐시) — 같은 키라 알파끼리 덮어쓰기 가능
              mkdir -p ~/.android
              [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
                -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              export ACRUX_ALPHA_KEYSTORE="$HOME/.android/debug.keystore" ACRUX_ALPHA_KEYSTORE_PASS=android ACRUX_ALPHA_KEY_ALIAS=androiddebugkey
            fi
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
            rustup target add aarch64-linux-android
            npm ci
            javac -d "$RUNNER_TEMP/pilot-tests" src-tauri/gen/android/app/src/main/java/com/acrux/next/{Pilot,TraceEvent,CaptureHealth}.java src-tauri/tests/android/{PilotReplayTest,CaptureHealthTest}.java
            java -cp "$RUNNER_TEMP/pilot-tests" com.acrux.next.PilotReplayTest
            java -cp "$RUNNER_TEMP/pilot-tests" com.acrux.next.CaptureHealthTest
            npm run tauri -- android build --apk --target aarch64 --ci        # 릴리스 (Rust 최적화 · 디버그 빌드는 화면 인식이 수십 배 느리고 190MB)
          } 2>&1 | tee android-build.log
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" Acrux-Alpha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-android
          path: Acrux-Alpha.apk
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view alpha-build-log --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create alpha-build-log --prerelease --latest=false --title "Alpha build log" --notes "알파 빌드 실패 기록" --repo "$GITHUB_REPOSITORY"
          [ -f android-build.log ] && gh release upload alpha-build-log android-build.log --clobber --repo "$GITHUB_REPOSITORY" || true

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build exe
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci
            npm run build
            npm run test:desktop
            python -m unittest discover -s tests -v
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
            npm run tauri -- build --no-bundle --ci
          } 2>&1 | tee windows-build.log
          cp src-tauri/target/release/acrux.exe Acrux-Alpha.exe
      - name: Check application startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "src-tauri/target/release/acrux.exe" -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw "Acrux exited during startup ($($app.ExitCode))" }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-windows
          path: Acrux-Alpha.exe
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view alpha-build-log --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create alpha-build-log --prerelease --latest=false --title "Alpha build log" --notes "알파 빌드 실패 기록" --repo "$GITHUB_REPOSITORY"
          [ -f windows-build.log ] && gh release upload alpha-build-log windows-build.log --clobber --repo "$GITHUB_REPOSITORY" || true

  publish:
    needs: [android, windows]
    if: always() && github.ref == 'refs/heads/main' && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha-*
          merge-multiple: true
      - name: Publish alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls Acrux-Alpha.apk Acrux-Alpha.exe 2>/dev/null)
          for f in $files; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
          short=${GITHUB_SHA::7}
          notes="Acrux 알파 (Tauri) · 커밋 $short · 실험 버전 — 정식 버전은 PC V2.5.x · Mobile V1.4.x
          
          - Acrux-Alpha.apk: Android (arm64) · 패키지 com.acrux.next (정식 앱과 따로 깔림)
          - Acrux-Alpha.exe: Windows (WebView2 필요 · 윈도우 10/11 은 대부분 이미 있음)
          
          Acrux alpha (Tauri) · commit $short · experimental — the release apps are PC V2.5.x · Mobile V1.4.x"
          if gh release view alpha --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload alpha $files $(for f in $files; do echo "$f.sha256"; done) --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit alpha --notes "$notes" --title "Acrux Alpha ($short)" --repo "$GITHUB_REPOSITORY"
          else
            gh release create alpha $files $(for f in $files; do echo "$f.sha256"; done) --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Acrux Alpha ($short)" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
