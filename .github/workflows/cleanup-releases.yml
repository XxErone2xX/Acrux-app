# 한 번만 쓰는 정리용: 최신 릴리스 하나만 남기고 예전 릴리스 · 태그를 전부 삭제
# (GitHub → Actions → Cleanup old releases → Run workflow) · 실행한 뒤 이 파일은 지움
name: Cleanup old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every release and tag except the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "Keeping $latest"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' | while read -r t; do
            if [ -n "$t" ] && [ "$t" != "$latest" ]; then
              echo "Deleting release $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --paginate -q '.[].ref' | sed 's#^refs/tags/##' | while read -r t; do
            if [ -n "$t" ] && [ "$t" != "$latest" ]; then
              echo "Deleting tag $t"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
            fi
          done
          echo "Remaining releases:"; gh release list --repo "$GITHUB_REPOSITORY" --limit 1000
