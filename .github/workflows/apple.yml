name: macOS build checks

on:
  push:
    branches: [Crossplatform-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build dependencies
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm ci
      - name: Check Rust core
        run: |
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build universal application
        run: npm run build:macos -- --ci
      - name: Check application startup
        shell: bash
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Acrux.app
          test -d "$app"
          lipo "$app/Contents/MacOS/acrux" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$app"
          open "$app"
          sleep 5
          pgrep -x acrux
          pkill -x acrux
          ditto -c -k --keepParent "$app" Acrux-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Acrux-macos-universal
          path: Acrux-macos-universal.zip
          if-no-files-found: error
