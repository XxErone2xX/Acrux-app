[package]
name = "acrux"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[lib]
name = "acrux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
jni = "0.21"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
