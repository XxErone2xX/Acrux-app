plugins {
    id "com.android.application"
}

android {
    namespace "com.acrux.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.acrux.mobile"
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName "0.6.5"
        // 폰은 ARM 만 (x86 은 에뮬레이터용 · 글자 읽기 라이브러리가 커서 빼면 APK 가 절반)
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 글자 읽기 (판매 보정 · 판매 · 메뉴 리셋) — 폰 안에서만 · 모델 포함 (인터넷 안 씀)
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // 키보드 · 마우스 입력 (PC 와 같은 키 · 우클릭) — Shizuku(ADB 권한)로 입력 서비스를 띄움
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:4.3"
}
